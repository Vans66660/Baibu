services:
  app:
    build: .
    environment:
      BACKGROUND_WORKER_URL: "${BACKGROUND_WORKER_URL:-}"
      BACKGROUND_WORKER_TOKEN: "${BACKGROUND_WORKER_TOKEN:-}"
      PUBLIC_MODE: "false"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - model-cache:/models
    mem_limit: 12g

volumes:
  model-cache:
